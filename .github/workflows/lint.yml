name: Python Quality & Lint CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu; fi

      - name: Syntax & Fatal Error Check (Flake8)
        run: |
          # Fails ONLY if there are genuine Python syntax errors or undefined symbols
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Code Style Advisory Check
        run: |
          # Advisory checks - exits zero so non-critical style issues won't break the build
          flake8 src/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics
