<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="sm_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1100" height="520" fill="url(#sm_bg)" />

  <text x="550" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    PCB INSPECTION &amp; ROBOTIC SORTING STATE MACHINE FLOW
  </text>
  <text x="550" y="66" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Asynchronous 10-Second Vision Window &bull; Pick &amp; Place Sequencing &bull; Fail-Safe Recovery
  </text>

  <!-- State 1: IDLE -->
  <g transform="translate(60, 140)">
    <rect width="200" height="110" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <text x="100" y="35" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">STATE 1: IDLE</text>
    <text x="100" y="60" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Main Conveyor Running</text>
    <text x="100" y="80" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">%M1.0=1 &amp; NOT %M2.0</text>
    <text x="100" y="98" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Waiting for PCB arrival</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(260, 195)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />
    <polygon points="75,-5 85,0 75,5" fill="#38bdf8" />
    <text x="40" y="-12" font-family="monospace" font-size="11" fill="#7dd3fc" text-anchor="middle">%I10.2 Detected</text>
    <text x="40" y="20" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">DB1.DBX0.1=1</text>
  </g>

  <!-- State 2: 10s INSPECTION WINDOW -->
  <g transform="translate(340, 120)">
    <rect width="240" height="150" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="2.5" />
    <text x="120" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#93c5fd" text-anchor="middle">STATE 2: INSPECTING</text>
    <text x="120" y="55" font-family="sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Stop_Mem (%M2.0) Active</text>
    <text x="120" y="75" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle">Timer1 (TP 10s) Holds Line</text>
    <rect x="25" y="90" width="190" height="42" rx="6" fill="#0f172a" stroke="#1d4ed8" />
    <text x="120" y="108" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">YOLOv8 Async Thread</text>
    <text x="120" y="124" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Searching for open_circuit</text>
  </g>

  <!-- Branch: Defect Detected -> Down to State 3 -->
  <g transform="translate(460, 270)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#f43f5e" stroke-width="2.5" />
    <polygon points="-5,75 0,85 5,75" fill="#f43f5e" />
    <text x="12" y="42" font-family="monospace" font-size="11" font-weight="bold" fill="#fb7185">DEFECT FOUND</text>
    <text x="12" y="58" font-family="sans-serif" font-size="10" fill="#f43f5e">Trigger=1 (DB1.DBX0.0)</text>
  </g>

  <!-- Branch: 10s Elapsed with NO defect -> Right to PASS -->
  <g transform="translate(580, 195)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#10b981" stroke-width="2.5" />
    <polygon points="155,-5 165,0 155,5" fill="#10b981" />
    <text x="80" y="-12" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">10.0s Timeout (No Defect)</text>
    <text x="80" y="18" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">Trigger=0 &bull; PASS</text>
  </g>

  <!-- State 4: PASS (Downstream Release) -->
  <g transform="translate(740, 140)">
    <rect width="220" height="110" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="110" y="35" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#a7f3d0" text-anchor="middle">STATE 4: PASS (CLEARED)</text>
    <text x="110" y="60" font-family="sans-serif" font-size="12" fill="#d1fae5" text-anchor="middle">Timer1 (TP) Expires</text>
    <text x="110" y="80" font-family="sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">Stop_Mem (%M2.0) Clears</text>
    <text x="110" y="98" font-family="sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">PCB Continues to Exit (%Q10.6)</text>
  </g>

  <!-- Return Pass to Idle -->
  <path d="M 850 250 L 850 290 L 160 290 L 160 250" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" />
  <text x="500" y="305" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Sensor clears &rarr; Return to IDLE</text>

  <!-- State 3: ROBOTIC PICK & PLACE SEQUENCE -->
  <g transform="translate(320, 350)">
    <rect width="480" height="135" rx="10" fill="#4c0519" stroke="#f43f5e" stroke-width="2" />
    <text x="240" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#fecdd3" text-anchor="middle">
      STATE 3: ROBOTIC DEFECT REMOVAL SEQUENCE
    </text>
    
    <g transform="translate(20, 45)">
      <rect width="130" height="70" rx="6" fill="#1f1218" stroke="#be123c" />
      <text x="65" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fda4af" text-anchor="middle">Step 1: Z Down</text>
      <text x="65" y="44" font-family="monospace" font-size="10" fill="#f43f5e" text-anchor="middle">Move_Z_Mem (%M3.0)</text>
      <text x="65" y="60" font-family="monospace" font-size="10" fill="#f43f5e" text-anchor="middle">Grab_Mem (%M4.0)</text>
    </g>

    <g transform="translate(170, 45)">
      <rect width="130" height="70" rx="6" fill="#1f1218" stroke="#be123c" />
      <text x="65" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fda4af" text-anchor="middle">Step 2: Transfer X</text>
      <text x="65" y="44" font-family="monospace" font-size="10" fill="#f43f5e" text-anchor="middle">%I10.5 Confirmed</text>
      <text x="65" y="60" font-family="monospace" font-size="10" fill="#f43f5e" text-anchor="middle">Move_X_Mem (%M5.0)</text>
    </g>

    <g transform="translate(320, 45)">
      <rect width="130" height="70" rx="6" fill="#1f1218" stroke="#be123c" />
      <text x="65" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fda4af" text-anchor="middle">Step 3: Drop Band 2</text>
      <text x="65" y="44" font-family="monospace" font-size="10" fill="#f43f5e" text-anchor="middle">%I10.4 Drops Vacuum</text>
      <text x="65" y="60" font-family="monospace" font-size="10" fill="#f43f5e" text-anchor="middle">Motor 2 (%Q10.4) ON</text>
    </g>
  </g>

  <!-- Return Pick & Place to Idle -->
  <path d="M 320 420 L 110 420 L 110 250" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4" />
  <text x="210" y="440" font-family="sans-serif" font-size="11" fill="#fda4af" text-anchor="middle">%I10.4 Resets Stop_Mem &rarr; Resume Main Line</text>
</svg>
